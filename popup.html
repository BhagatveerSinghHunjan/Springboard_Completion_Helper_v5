<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Springboard Helper</title>
  <style>
    body { width: 320px; font-family: Arial, sans-serif; padding: 14px; margin: 0; }
    h3 { margin: 0 0 8px; font-size: 16px; }
    p { font-size: 12px; color: #555; line-height: 1.4; margin: 0 0 10px; }
    button { width: 100%; padding: 10px; margin-top: 7px; border: 0; border-radius: 7px; cursor: pointer; font-size: 13px; }
    #start { background: #111; color: #fff; }
    #stop { background: #eee; color: #111; }
    #status { font-size: 12px; margin-top: 10px; line-height: 1.4; color: #222; }
  </style>
</head>
<body>
  <h3>Springboard Helper v5.1.1</h3>
  <p>Marks the current lesson complete, waits for confirmation + sidebar completion, then advances. Never skips ahead unverified.</p>
  <button id="start">Start Auto Complete</button>
  <button id="stop">Stop</button>
  <div id="status">Ready.</div>
  <script src="popup.js"></script>
</body>
</html>
